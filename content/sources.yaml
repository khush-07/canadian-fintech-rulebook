# Source registry — every citation on the site points to one of these.
#
# authority:
#   binding       = statute or regulation (the law itself)
#   interpretive  = regulator guidance/bulletins (how the regulator reads the law)
#   best_practice = our recommendation; never presented as a legal requirement
#
# pinpoint_url_pattern: Justice Laws supports per-section URLs, so citations
# deep-link straight to the exact section, e.g. .../E-1.6/section-11.html
#
# currency_date = "current to" date shown on the official source when last checked
# last_checked  = date a person on our team last re-read the source

